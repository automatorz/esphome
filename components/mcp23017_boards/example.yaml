# Example configuration for the `mcp23017_boards` external component.
#
# This is a Python-only config-expansion layer: everything below expands into
# plain stock ESPHome entities (mcp23017 hubs, gpio binary_sensors, gpio
# outputs, output switches and binary lights). Runtime behaviour is identical
# to hand-writing those entities. All names here are fictitious placeholders.

# Pull the component in from this repo's `components/` directory.
external_components:
  - source:
      type: local
      path: components

# A standard I2C bus. The board below references it by this id.
i2c:
  - id: bus_a
    sda: GPIO21
    scl: GPIO22
    scan: true

# The whole MCP23017 wiring harness, expressed compactly.
mcp23017_boards:
  boards:
    # One "board" = two MCP23017 chips on the same I2C bus.
    - board_id: "A1"
      i2c_id: bus_a
      chip1_address: 0x20   # default, shown for clarity
      chip2_address: 0x21   # default, shown for clarity

      # Bank A = pins 0..7 of each chip (the "Bottom" row). Declared as inputs,
      # so it generates 16 stock gpio binary_sensors:
      #   has_boardA1_chip01_pin00 .. has_boardA1_chip01_pin07
      #   has_boardA1_chip02_pin00 .. has_boardA1_chip02_pin07
      # Each is polling (use_interrupt: false), inverted, input+pullup.
      bank_a:
        direction: input

      # Bank B = pins 8..15 of each chip (the "Top" row). Declared as outputs.
      #
      # The `pins:` map is nested by CHIP first, then by physical pin, so an
      # override targets exactly one chip (nesting it under "01" does NOT also
      # apply it to chip "02"). The chip key accepts "01"/"02" (strings) or the
      # bare ints 1/2 — both normalize to the canonical "01"/"02".
      #
      # Valid inner pins for bank_b are 8..15 (0..7 would be bank_a). Every pin
      # NOT listed defaults to the `switch` role, which generates a stock gpio
      # output plus an `output` switch (id swA1_chipCC_pinPP, restore_mode
      # ALWAYS_OFF) — e.g. for relays.
      bank_b:
        direction: output
        pins:
          # --- Chip 1 ---------------------------------------------------------
          "01":
            # Pin 8 on chip 1 is a room light instead of a bare switch. A
            # `light` pin generates a gpio output + a binary light (no switch),
            # so Home Assistant sees one entity that owns the output.
            8:
              role: light
              id: workshop_light
              name: "Workshop Light"
              # Wire physical push-buttons (input binary_sensors generated by
              # bank_a above) to this light. These add on_press automations
              # additively, so you can still attach more via !extend elsewhere.
              on_buttons:
                - has_boardA1_chip01_pin00
              off_buttons:
                - has_boardA1_chip01_pin01

            # Pin 9 on chip 1 is another light with its own on/off buttons.
            9:
              role: light
              id: garage_light
              name: "Garage Light"
              on_buttons:
                - has_boardA1_chip01_pin02
              off_buttons:
                - has_boardA1_chip01_pin03

            # Pin 10 on chip 1: a light driven from two different wall buttons
            # for ON and one for OFF (lists are additive).
            10:
              role: light
              id: lab_room_light
              name: "Lab Room Light"
              on_buttons:
                - has_boardA1_chip01_pin04
                - has_boardA1_chip01_pin05
              off_buttons:
                - has_boardA1_chip01_pin06

            # Pin 11 on chip 1: an explicit switch (same as omitting it, shown
            # here only to illustrate that `role: switch` is the default).
            11:
              role: switch

            # Pins 12..15 on chip 1 are omitted -> default `switch` role.

          # --- Chip 2 ---------------------------------------------------------
          "02":
            # Pin 8 on chip 2 is a light. Note this is a DIFFERENT physical pin
            # from chip 1 pin 8 above: nesting under "02" scopes it to chip 2,
            # so there is no id/location collision between the two.
            8:
              role: light
              id: hallway_light
              name: "Hallway Light"
              # Buttons may reference inputs on EITHER chip of ANY board; here
              # they use chip 2's bank_a inputs.
              on_buttons:
                - has_boardA1_chip02_pin00
              off_buttons:
                - has_boardA1_chip02_pin01

            # Pins 9..15 on chip 2 are omitted -> default `switch` role.
