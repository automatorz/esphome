# Example configuration for the `mcp23017_boards` external component.
#
# This is a Python-only config-expansion layer: everything below expands into
# plain stock ESPHome entities (mcp23017 hubs, gpio binary_sensors, gpio
# outputs, output switches and binary lights). Runtime behaviour is identical
# to hand-writing those entities. All names here are fictitious placeholders.

# Pull the component in from this repo's `components/` directory.
external_components:
  - source:
      type: local
      path: components

# A standard I2C bus. The board below references it by this id.
i2c:
  - id: bus_a
    sda: GPIO21
    scl: GPIO22
    scan: true

# The whole MCP23017 wiring harness, expressed compactly.
mcp23017_boards:
  boards:
    # One "board" = two MCP23017 chips on the same I2C bus.
    - board_id: "A1"
      i2c_id: bus_a
      chip1_address: 0x20   # default, shown for clarity
      chip2_address: 0x21   # default, shown for clarity

      # Bank A = pins 0..7 of each chip (the "Bottom" row). Declared as inputs,
      # so it generates 16 stock gpio binary_sensors:
      #   has_boardA1_chip01_pin00 .. has_boardA1_chip01_pin07
      #   has_boardA1_chip02_pin00 .. has_boardA1_chip02_pin07
      # Each is polling (use_interrupt: false), inverted, input+pullup.
      bank_a:
        direction: input

      # Bank B = pins 8..15 of each chip (the "Top" row). Declared as outputs.
      # Every pin NOT listed under `pins:` defaults to the `switch` role, which
      # generates a stock gpio output plus an `output` switch
      # (id swA1_chipCC_pinPP, restore_mode ALWAYS_OFF) — e.g. for relays.
      bank_b:
        direction: output
        pins:
          # Pin 8 on chip 1 is a room light instead of a bare switch.
          # A `light` pin generates a gpio output + a binary light (no switch),
          # so Home Assistant sees one entity that owns the output.
          8:
            role: light
            id: workshop_light
            name: "Workshop Light"
            # Wire physical push-buttons (input binary_sensors generated above)
            # to this light. These add on_press automations additively, so you
            # can still attach more automations elsewhere via !extend.
            on_buttons:
              - has_boardA1_chip01_pin00
            off_buttons:
              - has_boardA1_chip01_pin01

          # Pin 9 on chip 1 is another light. A single button can toggle via a
          # pair of on/off buttons, or you may list several buttons per list.
          9:
            role: light
            id: garage_light
            name: "Garage Light"
            on_buttons:
              - has_boardA1_chip01_pin02
            off_buttons:
              - has_boardA1_chip01_pin03

          # Pin 10 on chip 1: a light driven from two different wall buttons for
          # ON and one for OFF (lists are additive).
          10:
            role: light
            id: lab_room_light
            name: "Lab Room Light"
            on_buttons:
              - has_boardA1_chip01_pin04
              - has_boardA1_chip01_pin05
            off_buttons:
              - has_boardA1_chip01_pin06

          # Everything else in bank_b (pins 11..15 on chip 1 and pins 8..15 on
          # chip 2) is omitted, so it stays the default `switch` role.
